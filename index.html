<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1118"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dial">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Dial — MP3 Player</title>
<style>
:root{--bg:#f2f2f7;--panel:#fff;--ink:#000;--mute:#6c6c70;--line:rgba(60,60,67,.16);--fill:rgba(120,120,128,.12);--glass:rgba(255,255,255,.78);--red:#d70015;--strip:#1c1c1e;--sb:#0d1118;--acc:var(--uacc,#0a5fe0);--on:var(--uon,#fff);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="black"]){--bg:#121214;--panel:#1c1c1e;--ink:#f5f5f7;--mute:#9a9aa1;--line:rgba(255,255,255,.12);--fill:rgba(120,120,128,.26);--glass:rgba(28,28,30,.78);--red:#ff6961;--strip:transparent;--acc:var(--uacc,#6aa9ff);--on:var(--uon,#0a1a33)}}
:root[data-theme="dark"]{--bg:#121214;--panel:#1c1c1e;--ink:#f5f5f7;--mute:#9a9aa1;--line:rgba(255,255,255,.12);--fill:rgba(120,120,128,.26);--glass:rgba(28,28,30,.78);--red:#ff6961;--strip:transparent;--acc:var(--uacc,#6aa9ff);--on:var(--uon,#0a1a33)}
:root[data-theme="black"]{--bg:#000;--panel:#101012;--ink:#fff;--mute:#8e8e93;--line:rgba(255,255,255,.1);--fill:rgba(120,120,128,.24);--glass:rgba(16,16,18,.82);--red:#ff6961;--strip:transparent;--sb:#000;--acc:var(--uacc,#6aa9ff);--on:var(--uon,#0a1a33)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{touch-action:pan-x pan-y;overscroll-behavior:none;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--strip);z-index:4}
input[type=text]{-webkit-user-select:text;user-select:text}
.art,.th{-webkit-user-drag:none}
main{max-width:520px;margin:0 auto;padding:12px 16px calc(120px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h2{font-size:1.05rem;margin:18px 0 6px;font-weight:700;letter-spacing:-.01em}
h2.pg{font-size:2.1rem;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.15}
h3{font-size:.8rem;color:var(--mute);margin:20px 0 6px 14px;font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px}
.hd .ib{color:var(--acc)}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 10px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
#dock>*{max-width:500px;margin:0 auto;pointer-events:auto}
.mini{display:flex;align-items:center;gap:2px;padding:7px 6px 10px 8px;position:relative;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.22),0 0 0 .5px var(--line)}
.mprog{position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.mprog i{display:block;height:100%;width:0;background:var(--acc)}
.mo{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:0}
.mini .th{width:40px;height:40px}
.sheet{--ink:#fff;--mute:rgba(255,255,255,.7);--panel:rgba(255,255,255,.1);--line:rgba(255,255,255,.18);--fill:rgba(255,255,255,.16);--acc:var(--uacc,#9db8ff);--on:var(--uon,#0a1226);--h:225;position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;color:var(--ink);background:linear-gradient(180deg,hsl(var(--h) 40% 26%),var(--sb) 72%);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transform:translateY(100%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.sheet.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#sh{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;touch-action:none}
.sp{width:48px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{border:0;background:none;color:var(--mute);padding:6px 12px;border-radius:7px;font-weight:600;font-size:.82rem;transition:background-color .2s,color .2s}
.seg .on{background:rgba(255,255,255,.26);color:#fff}
#np{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:0 26px;max-width:480px;width:100%;margin:0 auto}
.art{width:min(84vw,42vh,380px);aspect-ratio:1;border-radius:14px;margin:0 auto;box-shadow:0 26px 50px -14px rgba(0,0,0,.65);background-size:cover;background-position:center;transition:transform .45s cubic-bezier(.34,1.4,.64,1)}
.sheet.paused .art{transform:scale(.88)}
.meta h1{font-size:1.4rem;margin:0;font-weight:700;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta p{margin:2px 0 0;color:var(--mute);min-height:1.4em;font-size:1.05rem}
.times{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mute);font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;padding:0 2px}
#play{width:80px;height:80px;background:none;border:0;display:grid;place-items:center}
#play svg{width:62px;height:62px;fill:#fff}
#prev svg,#next svg{width:38px;height:38px}
.vol{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:.85rem}
.vol input[type=range]{flex:1}
#qv,#fx{flex:1;overflow-y:auto;padding:0 18px 24px;max-width:520px;width:100%;margin:0 auto}
.ib{position:relative;background:none;border:0;padding:12px;border-radius:50%;display:grid;place-items:center}
.ib svg{width:24px;height:24px;fill:currentColor}
.ib.on{color:var(--acc)}
.ib[data-n="1"]::after{content:"1";position:absolute;font-size:.6rem;font-weight:700;right:9px;top:9px}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:transparent;cursor:pointer;flex:1}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--fill-c,var(--ink)) var(--p,0%),var(--line) var(--p,0%))}
.rng::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--fill-c,var(--ink)) var(--p,0%),var(--line) var(--p,0%))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .15s}
.rng::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.rng:active::-webkit-slider-thumb{transform:scale(1.4)}
#seek{--fill-c:var(--acc)}
input[type=range]{accent-color:var(--acc)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 8px}
.add,.chip{border-radius:999px;border:0;background:var(--fill);padding:7px 15px;font-weight:600;font-size:.92rem}
.add{color:var(--acc)}
@supports(background:color-mix(in srgb,red,blue)){.add{background:color-mix(in srgb,var(--acc) 16%,transparent)}}
.chip.on,.chip.pri{background:var(--acc);color:var(--on)}
.chip.dng{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ghost{background:none;border:0;color:var(--acc);padding:6px 0;font-weight:600}
input[type=text],select{font:inherit;color:var(--ink);background:var(--fill);border:0;border-radius:10px;padding:10px 12px;min-width:0}
input[type=text]{flex:1}
input[type=text].nm{width:100%;font-size:1.9rem;font-weight:800;letter-spacing:-.02em;background:none;padding:4px 0;margin:2px 0 8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.card{background:var(--panel);border-radius:12px;padding:12px 14px}
.rr{display:flex;justify-content:space-between;margin-bottom:2px}
.rr output{color:var(--mute);font-variant-numeric:tabular-nums}
.sws{display:flex;flex-wrap:wrap;gap:14px;padding:16px}
.sw{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--fill);font-size:.68rem;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 .5px rgba(128,128,128,.4)}
.sw.on{outline:2px solid var(--ink);outline-offset:3px}
.cust{position:relative;background:conic-gradient(#ff3b30,#ffcc00,#34c759,#32ade6,#5856d6,#ff2d55,#ff3b30);cursor:pointer}
.cust input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.chips+#eqb{margin-top:8px}
.band{display:grid;grid-template-columns:58px 1fr 52px;align-items:center;gap:10px;margin:4px 0}
.band output{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);font-size:.85rem}
ul{list-style:none;margin:0;padding:0;background:var(--panel);border-radius:12px;overflow:hidden}
li{position:relative;display:flex;align-items:center;touch-action:pan-y;background:var(--panel)}
li::after{content:"";position:absolute;left:var(--ins,74px);right:0;bottom:0;height:.5px;background:var(--line)}
li:last-child::after{display:none}
#up{--ins:100px}
li .m{flex:1;min-width:0;background:none;border:0;display:flex;align-items:center;gap:12px;padding:8px 14px;text-align:left;min-height:64px}
.pl .m::after{content:"›";font-size:1.6rem;line-height:1;color:var(--mute)}
.m .tx{flex:1}
.th{width:48px;height:48px;border-radius:8px;flex:none;background-size:cover;background-position:center;box-shadow:inset 0 0 0 .5px rgba(128,128,128,.25)}
.tx{display:flex;flex-direction:column;min-width:0}
.tx b{font-weight:600}
.tx b,.tx small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small,.d{color:var(--mute);font-size:.85rem}
li.cur .tx b{color:var(--acc)}
.q{border:0;background:none;padding:12px;font-size:1.25rem;color:var(--acc)}
.q:last-child{color:var(--mute)}
#up li{user-select:none;-webkit-user-select:none;gap:12px;padding:8px 14px 8px 0}
#up .tx{flex:1}
.h{background:none;border:0;padding:12px 4px 12px 14px;color:var(--mute);touch-action:none;cursor:grab}
li.lift{z-index:2;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.empty{padding:16px;text-align:center;color:var(--mute);margin:0;font-size:.9rem}
#toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--glass);color:var(--ink);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 6px 24px rgba(0,0,0,.3),0 0 0 .5px var(--line);padding:10px 18px;border-radius:999px;font-size:.9rem;font-weight:500;z-index:20;max-width:90vw;text-align:center}
#upd{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:94vw;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:30;display:flex;align-items:center;gap:12px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 6px 24px rgba(0,0,0,.3),0 0 0 .5px var(--line);padding:6px 6px 6px 16px;border-radius:999px;font-size:.9rem;font-weight:500;color:var(--ink)}
#upd button{border:0;border-radius:999px;background:var(--acc);color:var(--on);padding:7px 16px;font-weight:700}
body.drop{outline:3px dashed var(--acc);outline-offset:-10px}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes rise{from{transform:translateY(100%);opacity:0}}
#np:not([hidden]),#qv:not([hidden]),#fx:not([hidden]){animation:fade .28s cubic-bezier(.2,.8,.2,1)}
.mini:not([hidden]){animation:rise .35s cubic-bezier(.2,.8,.2,1)}
#toast:not([hidden]){animation:fade .2s}
.ib,.chip,.add,#play,.sw{transition:transform .12s,background-color .2s,color .2s}
.ib:active,.chip:active,.add:active,#play:active,.sw:active{transform:scale(.92)}
li .m{transition:background-color .15s}
li .m:active{background:var(--fill)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<section id="lists"></section>
</main>

<div id="dock">
  <div class="mini" id="mini" hidden>
    <div class="mprog"><i id="mpi"></i></div>
    <button class="mo" id="mopen" aria-label="Open player"><span class="th" id="mth"></span><span class="tx"><b id="mt"></b><small id="ma"></small></span></button>
    <button class="ib" id="mp" aria-label="Play"></button>
    <button class="ib" id="mn" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
  </div>
</div>

<div class="sheet paused" id="sheet" role="dialog" aria-modal="true" aria-label="Player" aria-hidden="true">
  <div id="sh">
    <button class="ib" id="close" aria-label="Close player"><svg viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
    <div class="seg" id="seg"><button class="on" data-v="np">Now Playing</button><button data-v="qv">Queue</button><button data-v="fx">Sound</button></div>
    <span class="sp"></span>
  </div>
  <div id="np">
    <div class="art" id="bigart"></div>
    <div class="meta"><h1 id="title">Nothing playing</h1><p id="art2"></p></div>
    <div><input type="range" class="rng" id="seek" min="0" max="1000" value="0" aria-label="Seek"><div class="times"><span id="te">0:00</span><span id="tr">-0:00</span></div></div>
    <div class="row">
      <button class="ib" id="shuf" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-3 4.2L8.6 8.8A3 3 0 0 0 6.2 8H3V6h3.2a5 5 0 0 1 4 2l.7 1 2.6-3.6A3 3 0 0 1 14.4 5H17V3zM3 16h3.2a3 3 0 0 0 2.4-1.2l.9-1.3 1.4 2L9.8 17a5 5 0 0 1-3.6 2H3v-3zm14 0h-2.6a3 3 0 0 1-2.4-1.2l-.5-.8 1.2-1.7.9 1.3a1 1 0 0 0 .8.4H17v-3l4 4-4 4v-3z"/></svg></button>
      <button class="ib" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg></button>
      <button id="play" aria-label="Play"></button>
      <button class="ib" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <button class="ib" id="rep" aria-label="Repeat: off"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
    </div>
    <label class="vol" id="volrow"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg><input type="range" class="rng" id="vol" min="0" max="1" step="0.01" value="1" aria-label="Volume"></label>
  </div>
  <div id="qv" hidden></div>
  <div id="fx" hidden>
    <h3>Speed</h3>
    <div class="card"><div class="rr"><span>Playback speed</span><output id="rl">1.0×</output></div><input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" aria-label="Playback speed" style="width:100%"></div>
    <h3>Equalizer</h3>
    <div class="card"><div class="chips" id="eqp"></div><div id="eqb"></div></div>
    <h3>Reverb</h3>
    <div class="card"><div class="chips" id="rvp"></div><label class="vol" style="margin-top:8px">Dry <input type="range" id="mix" min="0" max="100" value="0" aria-label="Reverb wet/dry mix"> Wet</label></div>
  </div>
</div>

<div id="upd" hidden><span>A new version is ready</span><button id="updb">Update</button></div>
<div id="toast" role="status" hidden></div>
<input type="file" id="file" accept="audio/*,.mp3" multiple hidden>
<audio id="a" preload="metadata" playsinline></audio>

<script>
const $=id=>document.getElementById(id),a=$('a');
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const C=2*Math.PI*88,uid=()=>Math.random().toString(36).slice(2,10);
const fmt=s=>{if(!isFinite(s)||!s)return'0:00';s=Math.floor(s);return(s/60|0)+':'+String(s%60).padStart(2,'0')};
const BANDS=['60 Hz','230 Hz','910 Hz','3.6 kHz','14 kHz'];
const EQP={Flat:[0,0,0,0,0],'Bass Boost':[8,5,1,0,0],Rock:[5,3,-2,3,5],Pop:[-1,3,5,2,-1]};
const RVP={Off:{mix:0,decay:1},Room:{mix:.25,decay:.8},Hall:{mix:.35,decay:2.8}};
const S={tracks:[],pl:[],order:[],pos:-1,orig:null,shuf:false,hist:[],rep:0,eq:[0,0,0,0,0],rv:{name:'Off',mix:0,decay:1},rate:1,vol:1,t:0,view:null,ui:{theme:'system',acc:null}};
const T=id=>S.tracks.find(t=>t.id==id),cur=()=>T(S.order[S.pos]);
let impTo=null,seek=0,lt=0,lp=0,sk=false,paintedId=null,lid=0;

/* ---------- storage (IndexedDB) ---------- */
let db;
const idb=()=>new Promise(r=>{try{const q=indexedDB.open('dial',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const put=(k,v)=>new Promise(r=>{if(!db)return r();try{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=t.onerror=r}catch(e){r()}});
const get=k=>new Promise(r=>{if(!db)return r();try{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
const del=k=>new Promise(r=>{if(!db)return r();try{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=t.onerror=r}catch(e){r()}});
let st;const save=()=>{clearTimeout(st);st=setTimeout(()=>put('state',JSON.stringify(S)),250)};
const urls={},mem={};
async function url(id){if(!urls[id]){const b=mem[id]||await get('f:'+id);if(!b)return null;urls[id]=URL.createObjectURL(b)}return urls[id]}

/* ---------- ID3 tags + cover art ---------- */
const dec=(e,b)=>new TextDecoder(e==1?'utf-16':e==2?'utf-16be':e==3?'utf-8':'latin1').decode(b).replace(/\0/g,'').trim();
async function tags(f){
  let title=f.name.replace(/\.[^.]+$/,''),artist='',art=null;
  try{
    const h=new Uint8Array(await f.slice(0,10).arrayBuffer());
    if(h[0]==73&&h[1]==68&&h[2]==51&&h[3]>=3){
      const tot=10+((h[6]&127)<<21|(h[7]&127)<<14|(h[8]&127)<<7|(h[9]&127));
      const b=new Uint8Array(await f.slice(0,Math.min(tot,8e6)).arrayBuffer()),v=h[3];
      let p=10,tt='',ta='';
      while(p+10<b.length){
        const id=String.fromCharCode(...b.slice(p,p+4));
        const sz=v==4?((b[p+4]&127)<<21|(b[p+5]&127)<<14|(b[p+6]&127)<<7|(b[p+7]&127)):((b[p+4]<<24|b[p+5]<<16|b[p+6]<<8|b[p+7])>>>0);
        if(!sz||!/^[A-Z0-9]{4}$/.test(id))break;
        const d=b.subarray(p+10,p+10+sz);
        if(id=='TIT2')tt=dec(d[0],d.subarray(1));
        else if(id=='TPE1')ta=dec(d[0],d.subarray(1));
        else if(id=='APIC'&&!art){
          let i=1;while(i<d.length&&d[i])i++;
          const mime=new TextDecoder().decode(d.subarray(1,i));i+=2;
          if(d[0]==1||d[0]==2){while(i+1<d.length&&(d[i]||d[i+1]))i+=2;i+=2}else{while(i<d.length&&d[i])i++;i++}
          if(i<d.length)art=new Blob([d.subarray(i)],{type:/^image\//.test(mime)?mime:'image/jpeg'});
        }
        p+=10+sz;

    if(h&&Math.abs(dy)>8){
      li.style.transition=`transform .2s ${EZ}`;li.style.transform=`translateY(${(j-i)*H}px)`;
      setTimeout(()=>{const[x]=S.order.splice(p+i,1);S.order.splice(p+j,0,x);save();renderQueue()},210);
    }else if(!h&&Math.abs(dx)>90){
      li.style.transition='transform .18s ease-out,opacity .18s';li.style.transform=`translateX(${dx>0?110:-110}%)`;li.style.opacity=0;
      setTimeout(()=>{
        li.style.transition='height .2s ease,padding .2s ease';li.style.overflow='hidden';li.style.height=H+'px';li.offsetHeight;
        li.style.height='0';li.style.paddingTop=li.style.paddingBottom='0';li.style.borderWidth='0';
        setTimeout(()=>{const[id]=S.order.splice(p+i,1);if(S.orig){const k=S.orig.indexOf(id);if(k>-1)S.orig.splice(k,1)}save();renderQueue()},210);
      },180);
    }else if(!h&&Math.abs(dx)<8&&Math.abs(dy)<8)go(p+i);
    else settle(li);
  };
  ul.onpointercancel=()=>{if(g){settle(g.li);g=null}};
}

function draw(){
  const d=a.duration,f=d?a.currentTime/d:0,c=cur();
  if(!sk){$('seek').value=f*1000;$('seek').style.setProperty('--p',f*100+'%')}
  $('mpi').style.width=f*100+'%';
  $('te').textContent=fmt(a.currentTime);$('tr').textContent='-'+fmt(d-a.currentTime);
  const tl=c?c.title:'Nothing playing',ar=c?c.artist||'Unknown artist':'';
  $('title').textContent=tl;$('art2').textContent=ar;$('mt').textContent=tl;$('ma').textContent=ar;
  $('mini').hidden=!c;
  if(c&&paintedId!=c.id){paintedId=c.id;paint($('bigart'),c);paint($('mth'),c);anim($('bigart'),[{opacity:0},{opacity:1}],320);$('sheet').style.setProperty('--h',hue(c.title+c.artist))}
  $('shuf').classList.toggle('on',S.shuf);$('shuf').setAttribute('aria-pressed',S.shuf);
  $('rep').classList.toggle('on',S.rep>0);$('rep').dataset.n=S.rep==2?'1':'';$('rep').setAttribute('aria-label','Repeat: '+['off','all','one'][S.rep]);
}
const PLAY='M8 5v14l11-7z',PAUSE='M6 5h4v14H6zm8 0h4v14h-4z';
const icon=p=>{const v=`<svg viewBox="0 0 24 24"><path d="${p?PAUSE:PLAY}"/></svg>`,l=p?'Pause':'Play';$('play').innerHTML=v;$('mp').innerHTML=v;$('play').setAttribute('aria-label',l);$('mp').setAttribute('aria-label',l);$('sheet').classList.toggle('paused',!p)};
a.ontimeupdate=()=>{
  draw();S.t=a.currentTime;
  if(Date.now()-lt>3000){lt=Date.now();save()}
  if('mediaSession' in navigator&&a.duration&&Date.now()-lp>1000){lp=Date.now();try{navigator.mediaSession.setPositionState({duration:a.duration,playbackRate:a.playbackRate,position:Math.min(a.currentTime,a.duration)})}catch(e){}}
};
a.onloadedmetadata=()=>{
  const t=cur();if(t&&t.dur!=a.duration){t.dur=a.duration;save();renderLists()}
  if(seek){a.currentTime=seek;seek=0}
  setRate(S.rate);draw();
};
a.onplay=()=>{icon(true);tailOn();if(ctx&&ctx.state!=='running')ctx.resume().catch(()=>{});if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'};
a.onpause=()=>{icon(false);tailOff();if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused'};
a.onerror=()=>{if(a.getAttribute('src'))toast('This file can\u2019t be played')};
a.onended=()=>{if(S.rep==2){a.currentTime=0;start()}else next()};

/* ---------- effects UI ---------- */
function chips(box,obj,on,fn){box.textContent='';Object.keys(obj).forEach(k=>{const b=el('button','chip'+(on(k)?' on':''),k);b.onclick=()=>fn(k);box.append(b)})}
const markEq=()=>[...$('eqp').children].forEach(b=>b.classList.toggle('on',EQP[b.textContent].join()==S.eq.join()));
function renderFx(){
  chips($('eqp'),EQP,k=>EQP[k].join()==S.eq.join(),k=>{S.eq=EQP[k].slice();applyEq();renderFx()});
  chips($('rvp'),RVP,k=>S.rv.name==k,k=>{S.rv={name:k,...RVP[k]};route();setRv();save();$('mix').value=S.rv.mix*100;renderFx()});
  const bx=$('eqb');bx.textContent='';
  BANDS.forEach((n,i)=>{
    const l=el('label','band'),r=el('input'),o=el('output','',(S.eq[i]>0?'+':'')+S.eq[i]+' dB');
    r.type='range';r.min=-12;r.max=12;r.step=1;r.value=S.eq[i];r.setAttribute('aria-label',n+' gain');
    r.oninput=()=>{S.eq[i]=+r.value;route();eqNow();o.textContent=(S.eq[i]>0?'+':'')+S.eq[i]+' dB';save();markEq()};
    l.append(el('span','',n),r,o);bx.append(l);
  });
  $('mix').value=S.rv.mix*100;$('rate').value=S.rate;$('rl').textContent=S.rate.toFixed(1)+'×';
}
$('mix').oninput=e=>{S.rv.mix=e.target.value/100;S.rv.name='';route();applyMix();save();[...$('rvp').children].forEach(b=>b.classList.remove('on'))};
$('rate').oninput=e=>{setRate(+(+e.target.value).toFixed(1));$('rl').textContent=S.rate.toFixed(1)+'×';save()};

/* ---------- controls ---------- */
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
const sheet=$('sheet'),sb=$('seek');
sb.onpointerdown=()=>sk=true;
sb.onpointerup=sb.onpointercancel=sb.onchange=()=>sk=false;
sb.oninput=()=>{if(a.duration)a.currentTime=sb.value/1000*a.duration;sb.style.setProperty('--p',sb.value/10+'%')};
$('play').onclick=$('mp').onclick=toggle;
$('next').onclick=$('mn').onclick=next;$('prev').onclick=prev;$('shuf').onclick=toggleShuf;
$('rep').onclick=()=>{S.rep=(S.rep+1)%3;save();draw()};
$('vol').oninput=e=>{a.volume=S.vol=+e.target.value;e.target.style.setProperty('--p',e.target.value*100+'%');save()};
$('file').onchange=e=>{if(impTo)imp([...e.target.files],impTo);e.target.value=''};

function view(v){['np','qv','fx'].forEach(id=>$(id).hidden=id!=v);[...$('seg').children].forEach(b=>b.classList.toggle('on',b.dataset.v==v))}
function openSheet(v){sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');document.querySelector('main').inert=$('dock').inert=true;view(v||'np');$('close').focus()}
function closeSheet(){sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true');document.querySelector('main').inert=$('dock').inert=false;$('mopen').focus()}
$('mopen').onclick=()=>openSheet('np');$('close').onclick=closeSheet;
[...$('seg').children].forEach(b=>b.onclick=()=>view(b.dataset.v));
let sy=null;const sh=$('sh');
sh.onpointerdown=e=>{if(e.target.closest('button'))return;sy=e.clientY;sheet.style.transition='none';sh.setPointerCapture(e.pointerId)};
sh.onpointermove=e=>{if(sy!=null)sheet.style.transform=`translateY(${Math.max(0,e.clientY-sy)}px)`};
sh.onpointerup=e=>{if(sy==null)return;const d=e.clientY-sy;sy=null;sheet.style.transition='';sheet.style.transform='';if(d>110)closeSheet()};

addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drop')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drop')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drop');if(S.view)imp([...e.dataTransfer.files],S.view)});
addEventListener('keydown',e=>{
  if(e.key=='Escape'&&sheet.classList.contains('open'))closeSheet();
  if(e.code=='Space'&&e.target==document.body){e.preventDefault();toggle()}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ctx&&ctx.state!=='running'&&!a.paused)ctx.resume().catch(()=>{})});
addEventListener('pagehide',()=>{S.t=a.currentTime;put('state',JSON.stringify(S))});
if('mediaSession' in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>{if(!a.getAttribute('src')||a.error){seek=S.t;load(true)}else start()});m.setActionHandler('pause',()=>a.pause());m.setActionHandler('nexttrack',next);m.setActionHandler('previoustrack',prev);m.setActionHandler('seekto',d=>{a.currentTime=d.seekTime})}

/* ---------- app updates ---------- */
const VER='5';
let swReg=null,swWait=null,updating=false;
const updUI=()=>{$('upd').hidden=!swWait};
function applyUpd(){updating=true;if(swWait)swWait.postMessage('skip');else location.reload()}
async function checkUpd(){
  if(!swReg)return 'none';
  try{await swReg.update()}catch(e){return 'offline'}
  const w=swReg.installing;
  if(w&&!swReg.waiting)await new Promise(r=>w.addEventListener('statechange',()=>{if(w.state=='installed'||w.state=='redundant')r()}));
  if(swReg.waiting&&navigator.serviceWorker.controller){swWait=swReg.waiting;updUI();return 'available'}
  return 'current';
}
$('updb').onclick=applyUpd;
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(r=>{
    swReg=r;
    if(r.waiting&&navigator.serviceWorker.controller){swWait=r.waiting;updUI()}
    r.addEventListener('updatefound',()=>{const w=r.installing;w.addEventListener('statechange',()=>{if(w.state=='installed'&&navigator.serviceWorker.controller){swWait=w;updUI()}})});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(updating)location.reload()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpd()});
}

/* ---------- boot: restore saved state ---------- */
(async()=>{
  await idb();
  try{const s=JSON.parse(await get('state')||'null');if(s)Object.assign(S,s)}catch(e){}
  theme();a.volume=.5;if(a.volume!==.5)$('volrow').hidden=true;a.volume=S.vol;$('vol').value=S.vol;$('vol').style.setProperty('--p',S.vol*100+'%');setRate(S.rate);renderFx();icon(false);if(!db)toast('Storage unavailable: songs will not be saved');
  if(S.pos>=0&&cur()){seek=S.t;await load(false)}else renderAll();
})();
</script>
<script>['gesturestart','gesturechange','gestureend'].forEach(t=>addEventListener(t,e=>e.preventDefault()));</script>
